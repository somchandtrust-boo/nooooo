<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050814">
<meta name="description" content="MY Alexa - CBRND Multilingual AI Voice Assistant">
<title>MY Alexa - CBRND AI Assistant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    color:#fff;
    background:
        radial-gradient(circle at 50% 35%,#192967 0%,#080d20 42%,#02040a 82%);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:600px;
    height:600px;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(0,190,255,.15),transparent 67%);
    pointer-events:none;
}

.app{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px;
}

/* HEADER */

header{
    width:100%;
    max-width:1050px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    background:linear-gradient(135deg,#00d9ff,#4055ff);
    box-shadow:0 0 28px rgba(0,200,255,.55);
}

.logo-name{
    font-size:20px;
    font-weight:bold;
}

.logo-sub{
    margin-top:3px;
    font-size:10px;
    color:#657696;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:#8998b8;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00e676;
    box-shadow:0 0 13px #00e676;
}

.status-dot.busy{
    background:#ffb300;
    box-shadow:0 0 13px #ffb300;
}

.status-dot.error{
    background:#ff1744;
    box-shadow:0 0 13px #ff1744;
}

/* MAIN */

.main{
    width:100%;
    max-width:950px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:15px 0 25px;
}

.greeting{
    text-align:center;
    margin-bottom:12px;
}

.greeting h1{
    font-size:clamp(30px,5vw,48px);
    background:linear-gradient(90deg,#fff,#79e5ff);
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:8px;
}

.greeting p{
    color:#7d8cad;
    font-size:14px;
}

/* LANGUAGE */

.language-panel{
    display:flex;
    gap:6px;
    padding:6px;
    margin:14px 0 5px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    background:rgba(255,255,255,.035);
    backdrop-filter:blur(12px);
}

.language-btn{
    border:0;
    background:transparent;
    color:#8c9abb;
    padding:9px 13px;
    border-radius:12px;
    cursor:pointer;
    font-size:12px;
}

.language-btn:hover{
    color:#fff;
    background:rgba(255,255,255,.06);
}

.language-btn.active{
    color:#fff;
    background:linear-gradient(
        135deg,
        rgba(0,190,255,.32),
        rgba(65,80,255,.35)
    );
}

/* ORB */

.orb-area{
    width:330px;
    height:330px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.orb-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,200,255,.22);
}

.ring1{
    width:285px;
    height:285px;
}

.ring2{
    width:330px;
    height:330px;
    border-color:rgba(80,100,255,.13);
}

.ring3{
    width:245px;
    height:245px;
    border-color:rgba(0,220,255,.14);
}

.orb{
    width:185px;
    height:185px;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle at 40% 28%,
            #d8ffff 0%,
            #43e4ff 8%,
            #008eff 30%,
            #2940ff 55%,
            #061039 76%
        );

    box-shadow:
        0 0 30px rgba(0,200,255,.75),
        0 0 85px rgba(0,130,255,.42),
        inset 0 0 35px rgba(255,255,255,.22);

    transition:.3s;
}

.orb::before{
    content:"";
    position:absolute;
    width:120px;
    height:45px;
    top:23px;
    left:31px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    filter:blur(8px);
}

.orb-icon{
    position:relative;
    z-index:2;
    font-size:55px;
    filter:drop-shadow(0 0 13px #fff);
}

.listening .orb{
    animation:pulse 1.1s infinite;
}

.thinking .orb{
    animation:think 1s infinite;
}

.speaking .orb{
    animation:speakPulse .55s infinite;
}

.listening .ring1,
.thinking .ring1{
    animation:ring 1.3s infinite;
}

.listening .ring2,
.thinking .ring2{
    animation:ring 1.7s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.08);
    }
}

@keyframes think{
    0%,100%{
        transform:rotate(0deg) scale(1);
    }
    50%{
        transform:rotate(180deg) scale(1.06);
    }
}

@keyframes speakPulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.05);
    }
}

@keyframes ring{
    0%{
        transform:scale(.88);
        opacity:.8;
    }
    100%{
        transform:scale(1.25);
        opacity:0;
    }
}

/* STATE */

.state{
    min-height:22px;
    color:#8190b0;
    font-size:14px;
    margin-top:0;
}

.transcript{
    width:min(760px,95%);
    min-height:60px;
    margin-top:11px;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    color:#dce7ff;
    line-height:1.55;

    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    background:rgba(255,255,255,.035);
    backdrop-filter:blur(12px);
}

/* MIC */

.mic-button{
    width:76px;
    height:76px;
    margin-top:22px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    color:#fff;
    font-size:27px;

    background:linear-gradient(145deg,#08c7ff,#4254ff);

    box-shadow:
        0 8px 30px rgba(0,170,255,.35),
        inset 0 1px 2px rgba(255,255,255,.5);

    transition:.2s;
}

.mic-button:hover{
    transform:scale(1.06);
}

.mic-button:active{
    transform:scale(.94);
}

.listening .mic-button{
    background:linear-gradient(145deg,#ff3970,#ff1744);
    box-shadow:0 0 35px rgba(255,40,90,.65);
}

.mic-button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

/* QUICK */

.quick{
    width:min(850px,100%);
    margin-top:24px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.quick button{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
    color:#bdc9e5;
    padding:12px 7px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
}

.quick button:hover{
    background:rgba(0,180,255,.1);
    border-color:rgba(0,200,255,.3);
    transform:translateY(-2px);
}

.quick-icon{
    display:block;
    font-size:19px;
    margin-bottom:4px;
}

/* HISTORY */

.history{
    width:min(760px,95%);
    margin-top:20px;
}

.history-title{
    color:#657596;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.history-box{
    max-height:115px;
    overflow:auto;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.04);
    color:#96a5c5;
    font-size:12px;
}

.history-time{
    color:#586a8f;
    white-space:nowrap;
}

footer{
    color:#4f5e7c;
    font-size:11px;
    text-align:center;
    padding:12px;
}

/* MOBILE */

@media(max-width:700px){

    .app{
        padding:14px;
    }

    .logo-name{
        font-size:17px;
    }

    .logo-sub{
        font-size:9px;
    }

    .status{
        font-size:11px;
    }

    .orb-area{
        width:280px;
        height:280px;
    }

    .ring1{
        width:245px;
        height:245px;
    }

    .ring2{
        width:280px;
        height:280px;
    }

    .ring3{
        width:210px;
        height:210px;
    }

    .orb{
        width:155px;
        height:155px;
    }

    .orb-icon{
        font-size:45px;
    }

    .language-panel{
        width:100%;
        max-width:380px;
        justify-content:center;
    }

    .language-btn{
        padding:9px 9px;
        font-size:11px;
    }

    .quick{
        grid-template-columns:repeat(2,1fr);
    }

    .quick button:last-child{
        grid-column:1/-1;
    }
}
</style>
</head>

<script>

/* ==========================================================
   CBRND ALEXA AI FRONTEND
   ========================================================== */


/* ----------------------------------------------------------
   BACKEND URL
---------------------------------------------------------- */

/*
   LOCAL COMPUTER:

   Backend:
   http://localhost:3000

   इसलिए API URL:
*/


   const API_URL = "https://your-backend-domain.com/api/ask";


/* ----------------------------------------------------------
   ELEMENTS
---------------------------------------------------------- */

const micButton =
    document.getElementById("micButton");

const transcript =
    document.getElementById("transcript");

const state =
    document.getElementById("state");

const systemStatus =
    document.getElementById("systemStatus");

const statusDot =
    document.getElementById("statusDot");

const orbArea =
    document.getElementById("orbArea");

const historyBox =
    document.getElementById("historyBox");

const greeting =
    document.getElementById("greeting");

const subtitle =
    document.getElementById("subtitle");


/* ----------------------------------------------------------
   LANGUAGE
---------------------------------------------------------- */

let selectedLanguage =
    localStorage.getItem("myAlexaLanguage") || "auto";

let detectedLanguage =
    "en";


function setLanguage(lang){

    selectedLanguage = lang;

    localStorage.setItem(
        "myAlexaLanguage",
        lang
    );

    document
        .querySelectorAll(".language-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.lang === lang
            );

        });

    updateLanguageUI();

}


function updateLanguageUI(){

    if(selectedLanguage === "hi"){

        subtitle.textContent =
            "हिंदी में कोई भी सवाल पूछिए";

        transcript.textContent =
            "पूछिए: \"मुझे भारत का इतिहास बताओ\"";

    }

    else if(selectedLanguage === "gu"){

        subtitle.textContent =
            "ગુજરાતીમાં કોઈપણ પ્રશ્ન પૂછો";

        transcript.textContent =
            "પૂછો: \"મને ગુજરાતનો ઇતિહાસ જણાવો\"";

    }

    else if(selectedLanguage === "en"){

        subtitle.textContent =
            "Ask me anything in English";

        transcript.textContent =
            "Ask: \"Tell me about Indian history\"";

    }

    else{

        subtitle.textContent =
            "Ask me anything in Hindi, English or Gujarati";

        transcript.textContent =
            "पूछिए / Ask / પૂછો";

    }

}


setLanguage(selectedLanguage);


/* ----------------------------------------------------------
   SPEECH RECOGNITION
---------------------------------------------------------- */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 3;


    recognition.onstart =
        function(){

            listening = true;

            orbArea.classList.add(
                "listening"
            );

            micButton.innerHTML =
                "⏹️";

            setBusy(
                getText("listening")
            );

        };


    recognition.onresult =
        function(event){

            let text = "";

            for(
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ){

                text +=
                    event.results[i][0].transcript;

            }

            text = text.trim();

            if(text){

                transcript.textContent =
                    text;

            }


            const lastResult =
                event.results[
                    event.results.length - 1
                ];


            if(lastResult.isFinal){

                detectedLanguage =
                    detectLanguage(text);

                addHistory(text);

                processVoiceCommand(
                    text
                );

            }

        };


    recognition.onerror =
        function(event){

            console.log(
                "Speech error:",
                event.error
            );

            stopListening();


            if(
                event.error ===
                "not-allowed"
            ){

                showError(
                    getText("micPermission")
                );

                speak(
                    getText("micPermission"),
                    getLanguageCode(
                        getResponseLanguage()
                    )
                );

            }

            else if(
                event.error ===
                "no-speech"
            ){

                state.textContent =
                    getText("noSpeech");

            }

            else{

                state.textContent =
                    getText("tryAgain");

            }

        };


    recognition.onend =
        function(){

            stopListening();

        };

}
else{

    micButton.disabled = true;

    showError(
        "Speech recognition is not supported. Please use Chrome or Edge."
    );

}


/* ----------------------------------------------------------
   RECOGNITION LANGUAGE
---------------------------------------------------------- */

function getRecognitionLanguage(){

    if(selectedLanguage === "hi")
        return "hi-IN";

    if(selectedLanguage === "gu")
        return "gu-IN";

    if(selectedLanguage === "en")
        return "en-IN";


    /*
       AUTO MODE

       We use Hindi-India as initial
       recognition language because this
       gives better Indian-language support
       in many Chrome installations.

       Manual buttons can lock a language.
    */

    return "hi-IN";

}


/* ----------------------------------------------------------
   LANGUAGE DETECTION
---------------------------------------------------------- */

function detectLanguage(text){

    if(selectedLanguage !== "auto"){

        return selectedLanguage;

    }


    if(
        /[\u0A80-\u0AFF]/.test(text)
    ){

        return "gu";

    }


    if(
        /[\u0900-\u097F]/.test(text)
    ){

        return "hi";

    }


    const t =
        text.toLowerCase();


    const guWords = [

        "shu",
        "chhe",
        "chho",
        "cho",
        "tamaru",
        "maru",
        "mane",
        "tame",
        "kem",
        "kyare",
        "kaho",
        "gujarat",
        "gujarati",
        "banavyu"

    ];


    const hiWords = [

        "kya",
        "hai",
        "aap",
        "mujhe",
        "mera",
        "meri",
        "kaise",
        "kaun",
        "naam",
        "batao",
        "samay",
        "itihas",
        "shayari"

    ];


    let guScore = 0;

    let hiScore = 0;


    guWords.forEach(
        word => {

            if(
                t.includes(word)
            ){

                guScore++;

            }

        }
    );


    hiWords.forEach(
        word => {

            if(
                t.includes(word)
            ){

                hiScore++;

            }

        }
    );


    if(
        guScore > hiScore &&
        guScore > 0
    ){

        return "gu";

    }


    if(hiScore > 0){

        return "hi";

    }


    return "en";

}


/* ----------------------------------------------------------
   RESPONSE LANGUAGE
---------------------------------------------------------- */

function getResponseLanguage(){

    if(selectedLanguage !== "auto"){

        return selectedLanguage;

    }

    return detectedLanguage || "en";

}


/* ----------------------------------------------------------
   TEXT
---------------------------------------------------------- */

const textData = {

    en:{
        ready:"Ready to listen",
        listening:"Listening...",
        thinking:"Thinking...",
        speaking:"Speaking...",
        noSpeech:"I did not hear anything.",
        tryAgain:"Please try again.",

        connection:"I cannot connect to my AI brain right now.",
        google:"Opening Google.",
        weather:"Opening the weather forecast.",
        name:"I am CBRND Alexa. You can ask me any question. I was created by Mr. Raaj. Thank you, Mr. Raaj, for creating me."
    },

    hi:{

        speaking:"मैं जवाब दे रही हूँ...",
        noSpeech:"मुझे कुछ सुनाई नहीं दिया।",
        tryAgain:"कृपया फिर से पूछिए।",
        micPermission:"कृपया माइक्रोफोन की अनुमति दें।",
        connection:"मैं अभी अपने AI brain से connect नहीं हो पा रही हूँ।",
        google:"Google खोल रही हूँ।",
        weather:"मैं मौसम की जानकारी खोल रही हूँ।",
        name:"मैं CBRND Alexa हूँ। आप मुझसे कोई भी सवाल पूछ सकते हैं। मुझे Mr. Raaj ने बनाया है। मुझे बनाने के लिए धन्यवाद, Mr. Raaj।"
    },

    gu:{
        ready:"સાંભળવા માટે તૈયાર છું",
        listening:"હું સાંભળી રહી છું...",
        thinking:"હું વિચારી રહી છું...",
        speaking:"હું જવાબ આપી રહી છું...",
        noSpeech:"મને કંઈ સંભળાયું નથી.",
        tryAgain:"કૃપા કરીને ફરીથી પૂછો.",
        micPermission:"કૃપા કરીને માઇક્રોફોનની પરવાનગી આપો.",
        connection:"હું અત્યારે મારા AI brain સાથે connect થઈ શકતી નથી.",
        google:"Google ખોલી રહી છું.",

        name:"હું CBRND Alexa છું. તમે મને કોઈપણ પ્રશ્ન પૂછી શકો છો. મને Mr. Raaj એ બનાવ્યો છે. મને બનાવવામાં મદદ કરવા બદલ આભાર, Mr. Raaj."

function getText(key){

    const lang =
        getResponseLanguage();

    return (
        textData[lang] &&
        textData[lang][key]

/* ----------------------------------------------------------
   VOICES
---------------------------------------------------------- */

let voices = [];


function loadVoices(){

    voices =
        speechSynthesis.getVoices();

}


loadVoices();


if(
    "onvoiceschanged"
    in speechSynthesis
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* ----------------------------------------------------------
   VOICE
---------------------------------------------------------- */

function chooseVoice(language){

    if(!voices.length)
        return null;


    const target = {

        hi:"hi",

        gu:"gu",

        en:"en"

    }[language] || "en";


    let voice =
        voices.find(
            v =>
            v.lang
            .toLowerCase()
            .startsWith(target)
        );


    if(voice)
        return voice;


    return voices.find(
        v =>
        v.lang
        .toLowerCase()
        .startsWith("en")
    ) || voices[0];

}


function getLanguageCode(lang){

    if(lang === "hi")
        return "hi-IN";

    if(lang === "gu")
        return "gu-IN";

    return "en-IN";

}


/* ----------------------------------------------------------
   SPEAK
---------------------------------------------------------- */

function speak(
    text,
    language
){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        getLanguageCode(language);

    utterance.rate =
        0.90;

    utterance.pitch =
        1.0;

    utterance.volume =
        1.0;


    const voice =
        chooseVoice(language);


    if(voice){

        utterance.voice =
            voice;

    }


    orbArea.classList.remove(
        "listening",
        "thinking"
    );

    orbArea.classList.add(
        "speaking"
    );


    utterance.onstart =
        function(){

            state.textContent =
                getText("speaking");

            systemStatus.textContent =
                "Speaking";

        };


    utterance.onend =
        function(){

            orbArea.classList.remove(
                "speaking"
            );

            state.textContent =
                getText("ready");

            setStatusReady();

        };


    utterance.onerror =
        function(){

            orbArea.classList.remove(
                "speaking"
            );

            setStatusReady();

        };


    speechSynthesis.speak(
        utterance
    );

}


/* ----------------------------------------------------------
   AI REQUEST
---------------------------------------------------------- */

async function askAI(
    message,
    language
){

    setThinking();


    try{

        const response =
            await fetch(
                API_URL,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        message:message,

                        language:language

                    })

                }
            );


        if(!response.ok){

            throw new Error(
                "Server error: " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data.success ||
            !data.answer
        ){

            throw new Error(
                "Invalid AI response"
            );

        }


        const answer =
            data.answer.trim();


        transcript.textContent =
            answer;


        speak(
            answer,
            language
        );


    }
    catch(error){

        console.error(
            "AI connection error:",
            error
        );


        orbArea.classList.remove(
            "thinking"
        );


        showError(
            getText("connection")
        );


        speak(
            getText("connection"),
            getLanguageCode(language)
        );

    }

}


/* ----------------------------------------------------------
   VOICE COMMAND
---------------------------------------------------------- */

async function processVoiceCommand(
    message
){

    const language =
        detectedLanguage;


    const text =
        message.toLowerCase().trim();


    /*
       Local name command.

       This does not need an AI request.
    */

    if(
        isNameQuestion(text)
    ){

        const answer =
            textData[
                language
            ].name;


        transcript.textContent =
            answer;


        speak(
            answer,
            language
        );


        return;

    }


    /*
       Stop voice.
    */

    if(
        text === "stop" ||
        text === "रुको" ||
        text === "બંધ"
    ){

        speechSynthesis.cancel();

        return;

    }


    /*
       Google.
    */

    if(
        isGoogleCommand(text)
    ){

        const answer =
            getText("google");


        transcript.textContent =
            answer;


        speak(
            answer,
            language
        );


        setTimeout(
            () => {

                window.open(
                    "https://www.google.com",
                    "_blank"
                );

            },
            800
        );


        return;

    }


    /*
       YouTube.
    */

    if(
        isYouTubeCommand(text)
    ){

        let answer;

        if(language === "hi")
            answer = "YouTube खोल रही हूँ।";

        else if(language === "gu")
            answer = "YouTube ખોલી રહી છું.";

        else
            answer = "Opening YouTube.";


        transcript.textContent =
            answer;


        speak(
            answer,
            language
        );


        setTimeout(
            () => {

                window.open(
                    "https://www.youtube.com",
                    "_blank"
                );

            },
            800
        );


        return;

    }


    /*
       Weather.
    */

    if(
        isWeatherCommand(text)
    ){

        const answer =
            getText("weather");


        transcript.textContent =
            answer;


        speak(
            answer,
            language
        );


        setTimeout(
            () => {

                window.open(
                    "https://www.google.com/search?q=weather",
                    "_blank"
                );

            },
            900
        );


        return;

    }


    /*
       Everything else goes to AI.
    */

    await askAI(
        message,
        language
    );

}


/* ----------------------------------------------------------
   NAME DETECTION
---------------------------------------------------------- */

function isNameQuestion(text){

    const phrases = [

        "who are you",
        "what are you",
        "what is your name",
        "what's your name",
        "your name",
        "who is this",

        "आप कौन हो",
        "आप कौन हैं",
        "आपका नाम",
        "आपका नाम क्या है",
        "तुम कौन हो",
        "तुम्हारा नाम",

        "તમારું નામ",
        "તમારું નામ શું છે",
        "તમે કોણ છો",
        "તારું નામ"

    ];


    return phrases.some(
        phrase =>
        text.includes(phrase)
    );

}

/* ----------------------------------------------------------
   HISTORY
---------------------------------------------------------- */

function addHistory(command){

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "history-item";


    const text =
        document.createElement(
            "span"
        );

    text.textContent =
        command;


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "history-time";

    time.textContent =
        new Date()
        .toLocaleTimeString(
            "en-IN",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );


    item.appendChild(text);

    item.appendChild(time);

    historyBox.prepend(item);


    while(
        historyBox.children.length > 8
    ){

        historyBox.removeChild(
            historyBox.lastChild
        );

    }

}


/* ----------------------------------------------------------
   UI STATUS
---------------------------------------------------------- */

function setBusy(message){

    orbArea.classList.remove(
        "thinking",
        "speaking"
    );

    orbArea.classList.add(
        "listening"
    );

    state.textContent =
        message;

    systemStatus.textContent =
        "Listening";

    statusDot.className =
        "status-dot busy";

}


function setThinking(){

    orbArea.classList.remove(
        "listening",
        "speaking"
    );

    orbArea.classList.add(
        "thinking"
    );

    state.textContent =
        getText("thinking");

    systemStatus.textContent =
        "AI Thinking";

    statusDot.className =
        "status-dot busy";

}


function setStatusReady(){

    systemStatus.textContent =
        "Ready";

    statusDot.className =
        "status-dot";

}


function showError(message){

    state.textContent =
        message;

    systemStatus.textContent =
        "Error";

    statusDot.className =
        "status-dot error";

}


/* ----------------------------------------------------------
   STOP LISTENING
---------------------------------------------------------- */

function stopListening(){

    listening = false;

    orbArea.classList.remove(
        "listening"
    );

    micButton.innerHTML =
        "🎤";

    if(
        !orbArea.classList.contains(
            "thinking"
        ) &&
        !orbArea.classList.contains(
            "speaking"
        )
    ){

        state.textContent =
            getText("ready");

        setStatusReady();

    }

}


/* ----------------------------------------------------------
   MIC BUTTON
---------------------------------------------------------- */

micButton.addEventListener(
    "click",
    function(){

        if(!recognition)
            return;


        if(listening){

            recognition.stop();

        }
        else{

            try{

                recognition.lang =
                    getRecognitionLanguage();

                recognition.start();

            }
            catch(error){

                console.log(error);

            }

        }

    }
);


/* ----------------------------------------------------------
   SPACE KEY
---------------------------------------------------------- */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.code === "Space" &&
            event.target.tagName !== "INPUT" &&
            event.target.tagName !== "TEXTAREA"
        ){

            event.preventDefault();

            if(listening){

                recognition.stop();

            }
            else{

                try{

                    recognition.lang =
                        getRecognitionLanguage();

                    recognition.start();

                }
                catch(error){}

            }

        }

    }
);


/* ----------------------------------------------------------
   GREETING
---------------------------------------------------------- */

function updateGreeting(){

    const hour =
        new Date().getHours();


    if(hour < 12){

        greeting.textContent =
            "Good Morning ☀️";

    }
    else if(hour < 18){

        greeting.textContent =
            "Good Afternoon 🌤️";

    }
    else{

        greeting.textContent =
            "Good Evening 🌙";

    }

}

updateGreeting();


/* ----------------------------------------------------------
   PAGE VISIBILITY
---------------------------------------------------------- */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            speechSynthesis.cancel();

            if(
                listening &&
                recognition
            ){

                try{
                    recognition.stop();
                }
                catch(e){}

            }

        }

    }
);
