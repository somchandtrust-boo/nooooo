<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050814">
<meta name="description" content="CBRND Alexa - Multilingual Voice Assistant">
<title>CBRND Alexa</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    background:
    radial-gradient(circle at 50% 35%,#18265f 0%,#080d20 40%,#02040b 80%);
    color:#fff;
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    width:550px;
    height:550px;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    background:radial-gradient(
        circle,
        rgba(0,200,255,.17),
        transparent 65%
    );
    pointer-events:none;
}

.app{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:18px;
}

/* HEADER */

header{
    width:100%;
    max-width:1050px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo-icon{
    width:48px;
    height:48px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:23px;
    background:linear-gradient(
        135deg,
        #00d9ff,
        #3f51ff
    );
    box-shadow:0 0 28px rgba(0,200,255,.55);
}

.logo-text{
    font-size:20px;
    font-weight:bold;
    letter-spacing:.6px;
}

.logo-sub{
    color:#667696;
    font-size:10px;
    margin-top:3px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;
    color:#8998ba;
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#00e676;
    box-shadow:0 0 13px #00e676;
}

/* MAIN */

.main{
    width:100%;
    max-width:950px;
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px 0 25px;
}

.greeting{
    text-align:center;
    margin-bottom:15px;
}

.greeting h1{
    font-size:clamp(30px,5vw,48px);
    background:linear-gradient(
        90deg,
        #ffffff,
        #7de7ff
    );
    -webkit-background-clip:text;
    color:transparent;
    margin-bottom:8px;
}

.greeting p{
    color:#7d8cad;
    font-size:14px;
}

/* LANGUAGE */

.language-panel{
    display:flex;
    gap:7px;
    padding:6px;
    margin:15px 0 10px;
    border-radius:18px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(10px);
}

.language-btn{
    border:none;
    background:transparent;
    color:#8e9cbb;
    padding:9px 14px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    transition:.2s;
}

.language-btn:hover{
    color:#fff;
    background:rgba(255,255,255,.06);
}

.language-btn.active{
    color:#fff;
    background:linear-gradient(
        135deg,
        rgba(0,180,255,.32),
        rgba(70,80,255,.32)
    );
    box-shadow:0 0 15px rgba(0,190,255,.12);
}

/* ORB */

.orb-area{
    width:330px;
    height:330px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.orb-ring{
    position:absolute;
    border-radius:50%;
    border:1px solid rgba(0,200,255,.22);
}

.ring1{
    width:285px;
    height:285px;
}

.ring2{
    width:330px;
    height:330px;
    border-color:rgba(80,100,255,.13);
}

.ring3{
    width:245px;
    height:245px;
    border-color:rgba(0,220,255,.14);
}

.orb{
    width:185px;
    height:185px;
    border-radius:50%;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;

    background:
    radial-gradient(
        circle at 40% 28%,
        #d7ffff 0%,
        #4be7ff 8%,
        #008fff 30%,
        #283fff 55%,
        #061039 76%
    );

    box-shadow:
    0 0 30px rgba(0,200,255,.75),
    0 0 85px rgba(0,130,255,.42),
    inset 0 0 35px rgba(255,255,255,.22);

    transition:.3s;
}

.orb::before{
    content:"";
    position:absolute;
    width:120px;
    height:45px;
    top:23px;
    left:31px;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    filter:blur(8px);
}

.orb-icon{
    position:relative;
    z-index:2;
    font-size:55px;
    filter:drop-shadow(0 0 13px #fff);
}

.listening .orb{
    animation:pulse 1.15s infinite;
}

.listening .ring1{
    animation:ring 1.3s infinite;
}

.listening .ring2{
    animation:ring 1.7s infinite;
}

@keyframes pulse{

    0%,100%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

}

@keyframes ring{

    0%{
        transform:scale(.88);
        opacity:.8;
    }

    100%{
        transform:scale(1.25);
        opacity:0;
    }

}

/* STATE */

.state{
    color:#7f8eaf;
    min-height:22px;
    font-size:14px;
    margin-top:5px;
}

.transcript{
    width:min(720px,95%);
    min-height:58px;
    margin-top:12px;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;

    border-radius:18px;

    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);

    color:#dbe7ff;
    line-height:1.55;

    backdrop-filter:blur(12px);
}

/* MIC */

.mic-button{
    width:76px;
    height:76px;
    margin-top:22px;
    border:none;
    border-radius:50%;
    cursor:pointer;
    color:#fff;
    font-size:27px;

    background:
    linear-gradient(
        145deg,
        #08c7ff,
        #4254ff
    );

    box-shadow:
    0 8px 30px rgba(0,170,255,.35),
    inset 0 1px 2px rgba(255,255,255,.5);

    transition:.2s;
}

.mic-button:hover{
    transform:scale(1.06);
}

.mic-button:active{
    transform:scale(.94);
}

.listening .mic-button{
    background:
    linear-gradient(
        145deg,
        #ff3970,
        #ff1744
    );

    box-shadow:
    0 0 35px rgba(255,40,90,.65);
}

/* QUICK COMMANDS */

.quick{
    width:min(850px,100%);
    margin-top:25px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:9px;
}

.quick button{
    border:1px solid rgba(255,255,255,.08);
    background:rgba(255,255,255,.035);
    color:#bdc9e5;
    padding:12px 7px;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
}

.quick button:hover{
    background:rgba(0,180,255,.1);
    border-color:rgba(0,200,255,.3);
    transform:translateY(-2px);
}

.quick-icon{
    display:block;
    font-size:19px;
    margin-bottom:4px;
}

/* HISTORY */

.history{
    width:min(720px,95%);
    margin-top:20px;
}

.history-title{
    color:#657596;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    margin-bottom:7px;
}

.history-box{
    max-height:110px;
    overflow:auto;
}

.history-item{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:7px 0;
    border-bottom:1px solid rgba(255,255,255,.04);
    color:#96a5c5;
    font-size:12px;
}

.history-time{
    color:#586a8f;
    white-space:nowrap;
}

footer{
    color:#4f5e7c;
    font-size:11px;
    text-align:center;
    padding:12px;
}

/* MOBILE */

@media(max-width:700px){

    .app{
        padding:14px;
    }

    .logo-text{
        font-size:17px;
    }

    .logo-sub{
        font-size:9px;
    }

    .status{
        font-size:11px;
    }

    .orb-area{
        width:280px;
        height:280px;
    }

    .ring1{
        width:245px;
        height:245px;
    }

    .ring2{
        width:280px;
        height:280px;
    }

    .ring3{
        width:210px;
        height:210px;
    }

    .orb{
        width:155px;
        height:155px;
    }

    .orb-icon{
        font-size:45px;
    }

    .language-panel{
        width:100%;
        max-width:370px;
        justify-content:center;
    }

    .language-btn{
        padding:9px 10px;
        font-size:12px;
    }

    .quick{
        grid-template-columns:repeat(2,1fr);
    }

    .quick button:last-child{
        grid-column:1 / -1;
    }

}

</style>
</head>

<body>

<div class="app">

<header>

    <div class="logo">

        <div class="logo-icon">
            ◉
        </div>

        <div>
            <div class="logo-text">
                CBRND Alexa
            </div>

            <div class="logo-sub">
                Multilingual Voice Assistant
            </div>
        </div>

    </div>

    <div class="status">

        <span class="status-dot"></span>

        <span id="systemStatus">
            Ready
        </span>

    </div>

</header>


<main class="main">


    <!-- GREETING -->

    <div class="greeting">

        <h1 id="greeting">
            Hello 👋
        </h1>

        <p id="subtitle">
            Tap the microphone and talk to CBRND Alexa
        </p>

    </div>


    <!-- LANGUAGE -->

    <div class="language-panel">

        <button
            class="language-btn active"
            data-lang="auto"
            onclick="setLanguage('auto')"
        >
            🌐 Auto
        </button>

        <button
            class="language-btn"
            data-lang="hi"
            onclick="setLanguage('hi')"
        >
            🇮🇳 हिंदी
        </button>

        <button
            class="language-btn"
            data-lang="en"
            onclick="setLanguage('en')"
        >
            🇬🇧 English
        </button>

        <button
            class="language-btn"
            data-lang="gu"
            onclick="setLanguage('gu')"
        >
            🟠 ગુજરાતી
        </button>

    </div>


    <!-- ALEXA ORB -->

    <div
        class="orb-area"
        id="orbArea"
    >

        <div class="orb-ring ring2"></div>

        <div class="orb-ring ring1"></div>

        <div class="orb-ring ring3"></div>

        <div class="orb">

            <div class="orb-icon">
                🎙️
            </div>

        </div>

    </div>


    <div
        class="state"
        id="state"
    >
        Ready to listen
    </div>


    <div
        class="transcript"
        id="transcript"
    >
        पूछिए: "आपका नाम क्या है?"
    </div>


    <!-- MICROPHONE -->

    <button
        class="mic-button"
        id="micButton"
        title="Start Listening"
    >
        🎤
    </button>


    <!-- QUICK COMMANDS -->

    <div class="quick">

        <button onclick="runCommand('What is your name')">

            <span class="quick-icon">
                🤖
            </span>

            Name

        </button>


        <button onclick="runCommand('What time is it')">

            <span class="quick-icon">
                🕐
            </span>

            Time

        </button>


        <button onclick="runCommand('What is today date')">

            <span class="quick-icon">
                📅
            </span>

            Date

        </button>


        <button onclick="runCommand('Open Google')">

            <span class="quick-icon">
                🔎
            </span>

            Google

        </button>


        <button onclick="runCommand('Open YouTube')">

            <span class="quick-icon">
                ▶️
            </span>

            YouTube

        </button>

    </div>


    <!-- HISTORY -->

    <div class="history">

        <div class="history-title">
            Recent Commands
        </div>

        <div
            class="history-box"
            id="historyBox"
        >

            <div class="history-item">

                <span>
                    CBRND Alexa ready
                </span>

                <span class="history-time">
                    Now
                </span>

            </div>

        </div>

    </div>

</main>


<footer>
    CBRND Alexa • Hindi • English • Gujarati
</footer>

</div>


<script>

/* ==========================================================
   CBRND ALEXA
   MULTILINGUAL VOICE ASSISTANT
   ========================================================== */


/* ELEMENTS */

const micButton =
    document.getElementById("micButton");

const transcript =
    document.getElementById("transcript");

const state =
    document.getElementById("state");

const systemStatus =
    document.getElementById("systemStatus");

const orbArea =
    document.getElementById("orbArea");

const historyBox =
    document.getElementById("historyBox");

const greeting =
    document.getElementById("greeting");

const subtitle =
    document.getElementById("subtitle");


/* ==========================================================
   LANGUAGE
   ========================================================== */

let selectedLanguage =
    localStorage.getItem("cbrndLanguage") || "auto";


function setLanguage(lang){

    selectedLanguage = lang;

    localStorage.setItem(
        "cbrndLanguage",
        lang
    );

    document
        .querySelectorAll(".language-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.lang === lang
            );

        });


    updateLanguageUI();

}


function updateLanguageUI(){

    if(selectedLanguage === "hi"){

        subtitle.textContent =
            "माइक्रोफोन दबाकर CBRND Alexa से बात करें";

        transcript.textContent =
            "पूछिए: \"आपका नाम क्या है?\"";

    }

    else if(selectedLanguage === "gu"){

        subtitle.textContent =
            "માઇક્રોફોન દબાવીને CBRND Alexa સાથે વાત કરો";

        transcript.textContent =
            "પૂછો: \"તમારું નામ શું છે?\"";

    }

    else if(selectedLanguage === "en"){

        subtitle.textContent =
            "Tap the microphone and talk to CBRND Alexa";

        transcript.textContent =
            "Ask: \"What is your name?\"";

    }

    else{

        subtitle.textContent =
            "Hindi, English or Gujarati — just speak naturally";

        transcript.textContent =
            "पूछिए / Ask / પૂછો";

    }

}


setLanguage(selectedLanguage);


/* ==========================================================
   SPEECH RECOGNITION
   ========================================================== */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;

let currentDetectedLanguage = "en";


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;

    recognition.interimResults = true;

    recognition.maxAlternatives = 5;


    recognition.onstart = function(){

        listening = true;

        orbArea.classList.add(
            "listening"
        );

        micButton.innerHTML =
            "⏹️";

        state.textContent =
            getText("listening");

        systemStatus.textContent =
            getText("listening");

    };


    recognition.onresult = function(event){

        let text = "";

        for(
            let i = event.resultIndex;
            i < event.results.length;
            i++
        ){

            text +=
                event.results[i][0].transcript;

        }

        text = text.trim();

        transcript.textContent =
            text;


        if(
            event.results[
                event.results.length - 1
            ].isFinal
        ){

            const detected =
                detectLanguage(text);

            currentDetectedLanguage =
                detected;

            addHistory(text);

            processCommand(
                text,
                detected
            );

        }

    };


    recognition.onerror =
        function(event){

            console.log(
                "Speech Error:",
                event.error
            );

            stopListening();


            if(
                event.error ===
                "not-allowed"
            ){

                state.textContent =
                    getText(
                        "micPermission"
                    );

                speak(
                    getText(
                        "micPermission"
                    ),
                    getLanguageCode(
                        selectedLanguage === "auto"
                        ? "en"
                        : selectedLanguage
                    )
                );

            }

            else if(
                event.error ===
                "no-speech"
            ){

                state.textContent =
                    getText(
                        "noSpeech"
                    );

            }

            else{

                state.textContent =
                    getText(
                        "tryAgain"
                    );

            }

        };


    recognition.onend =
        function(){

            stopListening();

        };

}
else{

    state.textContent =
        "Speech recognition is not supported in this browser.";

    micButton.disabled = true;

}


/* ==========================================================
   START LISTENING
   ========================================================== */

function startListening(){

    if(!recognition)
        return;


    try{

        recognition.lang =
            getRecognitionLanguage();

        recognition.start();

    }
    catch(error){

        console.log(error);

    }

}


function stopListening(){

    listening = false;

    orbArea.classList.remove(
        "listening"
    );

    micButton.innerHTML =
        "🎤";

    systemStatus.textContent =
        getText("ready");

    state.textContent =
        getText("ready");

}


micButton.addEventListener(
    "click",
    function(){

        if(!recognition)
            return;


        if(listening){

            recognition.stop();

        }
        else{

            startListening();

        }

    }
);


/* ==========================================================
   RECOGNITION LANGUAGE
   ========================================================== */

function getRecognitionLanguage(){

    if(selectedLanguage === "hi")
        return "hi-IN";

    if(selectedLanguage === "gu")
        return "gu-IN";

    if(selectedLanguage === "en")
        return "en-IN";


    /*
       AUTO MODE

       We start with Hindi because Chrome's
       speech engine can recognize Indian
       English/Hindi reasonably well.

       Multiple alternatives are requested.
    */

    return "hi-IN";

}


/* ==========================================================
   LANGUAGE DETECTION
   ========================================================== */

function detectLanguage(text){

    if(selectedLanguage !== "auto"){

        return selectedLanguage;

    }


    const gujaratiPattern =
        /[\u0A80-\u0AFF]/;

    const hindiPattern =
        /[\u0900-\u097F]/;


    if(
        gujaratiPattern.test(text)
    ){

        return "gu";

    }


    if(
        hindiPattern.test(text)
    ){

        return "hi";

    }


    /*
       Roman Hindi / Gujarati detection
    */

    const t =
        text.toLowerCase();


    const gujaratiWords = [

        "shu",
        "chhe",
        "cho",
        "tamaru",
        "maru",
        "mane",
        "tame",
        "kem",
        "kyare",
        "kaho",
        "naam",
        "banavyu"

    ];


    const hindiWords = [

        "kya",
        "hai",
        "aap",
        "mujhe",
        "mera",
        "kaise",
        "kaun",
        "naam",
        "batao",
        "samay"

    ];


    let guScore = 0;

    let hiScore = 0;


    gujaratiWords.forEach(word => {

        if(
            t.includes(
                word
            )
        ){

            guScore++;

        }

    });


    hindiWords.forEach(word => {

        if(
            t.includes(
                word
            )
        ){

            hiScore++;

        }

    });


    if(guScore > hiScore && guScore > 0)
        return "gu";


    if(hiScore > 0)
        return "hi";


    return "en";

}


/* ==========================================================
   TEXT TRANSLATIONS
   ========================================================== */

const texts = {

    en:{

        ready:
            "Ready to listen",

        listening:
            "Listening...",

        speaking:
            "Speaking...",

        noSpeech:
            "I did not hear anything.",

        tryAgain:
            "Please try again.",

        micPermission:
            "Please allow microphone permission.",

        hello:
            "Hello! I am CBRND Alexa. How can I help you?",

        name:
            "I am CBRND Alexa. You can ask me any question. I was created by Mr. Raaj. Thank you, Mr. Raaj, for creating me.",

        time:
            "The current time is",

        date:
            "Today is",

        day:
            "Today is",

        google:
            "Opening Google.",

        youtube:
            "Opening YouTube.",

        facebook:
            "Opening Facebook.",

        weather:
            "I am opening the weather forecast for you.",

        who:
            "I am CBRND Alexa, your multilingual voice assistant.",

        how:
            "I am doing great and ready to help you.",

        thanks:
            "You're welcome.",

        morning:
            "Good morning. I hope you have a wonderful day.",

        night:
            "Good night. Have a peaceful sleep.",

        search:
            "Searching Google for",

        unknown:
            "I heard you. You can ask me questions about time, date, search, websites and more."

    },


    hi:{

        ready:
            "सुनने के लिए तैयार हूँ",

        listening:
            "मैं सुन रही हूँ...",

        speaking:
            "मैं जवाब दे रही हूँ...",

        noSpeech:
            "मुझे कुछ सुनाई नहीं दिया।",

        tryAgain:
            "कृपया फिर से पूछिए।",

        micPermission:
            "कृपया माइक्रोफोन की अनुमति दें।",

        hello:
            "नमस्ते! मैं CBRND Alexa हूँ। मैं आपकी कैसे मदद कर सकती हूँ?",

        name:
            "मैं CBRND Alexa हूँ। आप मुझसे कोई भी सवाल पूछ सकते हैं। मुझे Mr. Raaj ने बनाया है। मुझे बनाने के लिए धन्यवाद, Mr. Raaj।",

        time:
            "अभी का समय है",

        date:
            "आज है",

        day:
            "आज",

        google:
            "Google खोल रही हूँ।",

        youtube:
            "YouTube खोल रही हूँ।",

        facebook:

/* ==========================================================
   GET LANGUAGE TEXT
   ========================================================== */

function getText(key){

    let lang =
        currentDetectedLanguage;


    if(
        selectedLanguage !== "auto"
    ){

        lang =
            selectedLanguage;

    }


    if(
        !texts[lang]
    ){

        lang = "en";

    }


    return texts[lang][key];

}


/* ==========================================================
   SPEECH SYNTHESIS
   ========================================================== */

let voices = [];


function loadVoices(){

    voices =
        speechSynthesis.getVoices();

}


loadVoices();


if(
    "onvoiceschanged"
    in speechSynthesis
){

    speechSynthesis.onvoiceschanged =
        loadVoices;

}


/* ==========================================================
   VOICE SELECTION
   ========================================================== */

function chooseVoice(language){

    if(!voices.length)
        return null;


    const langMap = {

        hi:"hi-IN",

        gu:"gu-IN",

        en:"en-IN"

    };


    const target =
        langMap[language] ||
        "en-IN";


    /*
       Exact language first
    */

    let voice =
        voices.find(
            v =>
            v.lang.toLowerCase() ===
            target.toLowerCase()
        );


    if(voice)
        return voice;


    /*
       Same language
    */

    const prefix =
        target
        .split("-")[0]
        .toLowerCase();


    voice =
        voices.find(
            v =>
            v.lang
            .toLowerCase()
            .startsWith(prefix)
        );


    if(voice)
        return voice;


    /*
       English fallback
    */

    return voices.find(
        v =>
        v.lang
        .toLowerCase()
        .startsWith("en")
    ) || voices[0];

}


/* ==========================================================
   LANGUAGE CODE
   ========================================================== */

function getLanguageCode(lang){

    if(lang === "hi")
        return "hi-IN";

    if(lang === "gu")
        return "gu-IN";

    return "en-IN";

}


/* ==========================================================
   SPEAK
   ========================================================== */

function speak(
    text,
    language="en-IN"
){

    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.text =
        text;


    utterance.lang =
        language;


    utterance.rate =
        0.90;


    utterance.pitch =
        1.0;


    utterance.volume =
        1.0;


    const langShort =
        language.startsWith("hi")
        ? "hi"
        : language.startsWith("gu")
        ? "gu"
        : "en";


    const voice =
        chooseVoice(
            langShort
        );


    if(voice){

        utterance.voice =
            voice;

    }


    utterance.onstart =
        function(){

            state.textContent =
                getText("speaking");

            systemStatus.textContent =
                "Speaking";

        };


    utterance.onend =
        function(){

            state.textContent =
                getText("ready");

            systemStatus.textContent =
                "Ready";

        };


    speechSynthesis.speak(
        utterance
    );

}


/* ==========================================================
   COMMAND PROCESSOR
   ========================================================== */

function processCommand(
    rawText,
    language
){

    const text =
        rawText
        .toLowerCase()
        .trim();


    currentDetectedLanguage =
        language;


    const responseLanguage =
        getLanguageCode(
            language
        );


    /* STOP */

    if(
        text.includes("stop") ||
        text.includes("रुको") ||
        text.includes("બંધ") ||
        text.includes("shut up")
    ){

        speechSynthesis.cancel();

        state.textContent =
            getText("ready");

        return;

    }


    /* HELLO */

    if(
        text.includes("hello") ||
        text.includes("hey") ||
        text.includes("नमस्ते") ||
        text.includes("हेलो") ||
        text.includes("નમસ્તે") ||
        text.includes("હેલો")
    ){

            getText("hello");

        transcript.textContent =
            answer;

        speak(
            answer,
            responseLanguage
        );

        return;

    }


    /* ======================================================
       NAME / IDENTITY
       ====================================================== */

    if(

        text.includes("who are you") ||

        text.includes("what are you") ||

        text.includes("your name") ||

        text.includes("what is your name") ||

        text.includes("what's your name") ||

        text.includes("who is this") ||

        text.includes("आप कौन हो") ||

        text.includes("आपका नाम") ||

        text.includes("तुम कौन हो") ||

        text.includes("तुम्हारा नाम") ||

        text.includes("नाम क्या है") ||

        text.includes("તમારું નામ") ||

        text.includes("તારું નામ") ||

        text.includes("તમે કોણ છો") ||

        text.includes("નામ શું છે")

    ){

        const answer =
            getText("name");

        transcript.textContent =
            answer;

        speak(
            answer,
            responseLanguage
        );

        return;

    }


    /* TIME */

    if(

        text.includes("what time") ||

        text.includes("time is it") ||

        text.includes("time") ||

        text.includes("समय") ||

        text.includes("कितने बजे") ||

        text.includes("સમય") ||

        text.includes("કેટલા વાગ્યા")

    ){

        const now =
            new Date();


        const time =
            now.toLocaleTimeString(
                language === "hi"
                ? "hi-IN"
                : language === "gu"
                ? "gu-IN"
                : "en-IN",
                {
                    hour:"numeric",
                    minute:"2-digit"
                }
            );


        const answer =
            getText("time") +
            " " +
            time;


        transcript.textContent =
            answer;


        speak(
            answer,
            responseLanguage
        );

        return;

    }


    /* DATE */

    if(

        text.includes("today date") ||

        text.includes("what is the date") ||

        text.includes("today's date") ||

        text.includes("date") ||

        text.includes("तारीख") ||

        text.includes("आज की तारीख") ||

        text.includes("આજની તારીખ")

            new Date()
            .toLocaleDateString(
                language === "hi"
                ? "hi-IN"
                : language === "gu"
                ? "gu-IN"
                : "en-IN",

                    day:"numeric",
                    month:"long",
                    year:"numeric"
                }
            );


        const answer =
            getText("date") +
            " " +
            date;


        transcript.textContent =
            answer;


        speak(
            answer,
            responseLanguage
        );

        return;

    }


    /* DAY */

    if(

        text.includes("what day") ||

        text.includes("which day") ||

        text.includes("कौन सा दिन") ||

        text.includes("आज कौन सा दिन") ||

                }
            );

            getText("day") +
            " " +
            day;


        transcript.textContent =

            responseLanguage

    /* GOOGLE */

        text.includes("गूगल खोलो") ||

        text.includes("गूगल") ||

    /* YOUTUBE */

    /* FACEBOOK */

        speak(
            answer,

    /* WEATHER */

        text.includes("હવામાન")

    ){

            getText("weather");


        transcript.textContent =

    }


    /* WHO */

    if(

        text.includes("who made you") ||

        text.includes("किसने बनाया") ||

        text.includes("आपको किसने बनाया") ||

    /* HOW ARE YOU */

    if(

    /* THANK YOU */

    if(

        text.includes("આભાર")

    ){

            getText("thanks");


        transcript.textContent =

        speak(

        );

    }


    /* GOOD MORNING */

    if(

        text.includes("શુભ સવાર")

    ){

            getText("morning");


        transcript.textContent =

        speak(

            responseLanguage
        );

    }


    /* GOOD NIGHT */

    if(

        text.includes("good night") ||

        text.includes("शुभ रात्रि") ||

        text.includes("શુભ રાત્રિ")

    ){

        const answer =
            getText("night");


        transcript.textContent =
            answer;


        speak(
            answer,
            responseLanguage
        );


        return;

    }


    /* SEARCH */

    let searchQuery = "";


    if(
        text.startsWith("search for ")
    ){

        searchQuery =
            text.replace(
                "search for ",
                ""
            ).trim();

    }


    if(
        text.startsWith("google search ")
    ){

        searchQuery =
            text.replace(
                "google search ",
                ""
            ).trim();

    }


    if(
        text.startsWith("सर्च ")
    ){

        searchQuery =
            text.replace(
                "सर्च ",
                ""
            ).trim();

    }


    if(
        text.startsWith("શોધો ")
    ){

        searchQuery =
            text.replace(
                "શોધો ",
                ""
            ).trim();

    }


    if(searchQuery){

        const answer =
            getText("search") +
            " " +
            searchQuery;


        transcript.textContent =
            answer;


        speak(
            answer,
            responseLanguage
        );

                    encodeURIComponent(
                        searchQuery
                    ),
                    "_blank"
                );

            },
            800
        );


        return;

    }


    /* UNKNOWN */

    const answer =
        getText("unknown");

        answer;

    );

/* ==========================================================
   QUICK COMMAND
   ========================================================== */

function runCommand(command){

    let language =
        selectedLanguage === "auto"
        ? "en"
        : selectedLanguage;


    /*
       If the selected language is Hindi,
       use Hindi identity command.
    */

    if(
        command.includes(
            "What is your name"
        )
    ){

        if(language === "hi"){

            command =
                "आपका नाम क्या है";

        }
        else if(language === "gu"){

            command =
                "તમારું નામ શું છે";

        }

    }


    addHistory(command);

    transcript.textContent =
        command;


    processCommand(
        command,
        language
    );

}


/* ==========================================================
   HISTORY
   ========================================================== */

function addHistory(command){

    const item =
        document.createElement(
            "div"
        );


    item.className =
        "history-item";


    const text =
        document.createElement(
            "span"
        );


    text.textContent =
        command;


    const time =
        document.createElement(
            "span"
        );


    time.className =
        "history-time";


    time.textContent =
        new Date()
        .toLocaleTimeString(
            "en-IN",
            {
                hour:"numeric",
                minute:"2-digit"
            }
        );


    item.appendChild(text);

    item.appendChild(time);

    historyBox.prepend(item);


    while(
        historyBox.children.length > 8
    ){

        historyBox.removeChild(
            historyBox.lastChild
        );

    }

}


/* ==========================================================
   GREETING
   ========================================================== */

function updateGreeting(){

    const hour =
        new Date().getHours();


    if(hour < 12){

        greeting.textContent =
            "Good Morning ☀️";

    }

    else if(hour < 18){

        greeting.textContent =
            "Good Afternoon 🌤️";

    }

    else{

        greeting.textContent =
            "Good Evening 🌙";

    }

}


updateGreeting();


/* ==========================================================
   KEYBOARD SPACE = MIC
   ========================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(

            event.code === "Space" &&

            event.target.tagName !==
            "INPUT" &&

            event.target.tagName !==
            "TEXTAREA"

        ){

            event.preventDefault();


            if(listening){

                recognition.stop();

            }
            else{

                startListening();

            }

        }

    }
);


/* ==========================================================
   PAGE VISIBILITY
   ========================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(document.hidden){

            speechSynthesis.cancel();


            if(
                listening &&
                recognition
            ){

                try{

                    recognition.stop();

                }
                catch(e){}

            }

        }

    }
);


/* ==========================================================
   FIRST LOAD
   ========================================================== */

setTimeout(
    function(){

        updateLanguageUI();

    },
    300
);
